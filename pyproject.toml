[project]
name = "Racepredict-AI"
version = "0.1.0"
description = "AI-powered horse race prediction system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django<5.2",
    "environs>=15.2.0",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
